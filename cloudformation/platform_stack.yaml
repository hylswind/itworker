AWSTemplateFormatVersion: "2010-09-09"
Description: >
  openzi platform (the target account). A self-built VPC with an internet-facing app ALB for
  app+commit-addressed routing (/{app}/{sha}/* and /{app}/info.json); an
  internet-facing control ALB in the DEFAULT VPC fronting the itworker instance
  (admin subdomain, bearer-key authenticated) that runs init/deploy/delete/recover;
  a daily Step Functions job that rebuilds the control instance; Image Builder infra
  for per-version app bakes; and a billing/console user scoped to Billing+Support
  (exempt from the sign-in lockout). The control ASG + launch template and the API
  key are created by itworker setup after this stack is up (not here).

Metadata:
  cfn-lint:
    config:
      # ConsolePassword is a NoEcho parameter generated by itworker setup and stored
      # in SSM SecureString; a Secrets Manager dependency just to hold a value the
      # operator must read is not worth it here.
      ignore_checks:
        - W1011

Parameters:
  Domain:
    Type: String
  HostedZoneId:
    Type: String
    Description: the account's public hosted zone (created by RegisterDomain), for ACM DNS validation and alias records.
  ConsolePassword:
    Type: String
    NoEcho: true
    Description: Initial console password for the billing user (generated by itworker setup).
  DefaultVpcId:
    Type: AWS::EC2::VPC::Id
    Description: The account's default VPC — where the itworker instance and the control ALB live.
  DefaultSubnetA:
    Type: AWS::EC2::Subnet::Id
    Description: A default subnet (AZ 1) for the control ALB.
  DefaultSubnetB:
    Type: AWS::EC2::Subnet::Id
    Description: A default subnet (AZ 2) for the control ALB.

Resources:
  # --- app network (self-built VPC; app instances + app ALB live here) ---
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: openzi-vpc }]
  Igw:
    Type: AWS::EC2::InternetGateway
  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw
  SubnetARouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable
  SubnetBRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # --- shared cert: apex ${Domain} (app ALB) + admin.${Domain} (control ALB), both
  # DNS-validated in the account's hosted zone. One cert, attached to both listeners. ---
  PlatformCert:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref Domain
      SubjectAlternativeNames:
        - !Sub admin.${Domain}
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref Domain
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub admin.${Domain}
          HostedZoneId: !Ref HostedZoneId

  # --- app ALB: HTTPS on ${Domain}; :80 redirects to :443. Per-app rules are added
  # at runtime (/{app}/info.json fixed-response by init, /{app}/{sha}/* forward by
  # deploy). ---
  AppAlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: app ALB ingress :80 + :443
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  AppAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: openzi-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref AppAlbSg]
      Subnets: [!Ref SubnetA, !Ref SubnetB]
  AppAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref Domain
      Type: A
      AliasTarget:
        DNSName: !GetAtt AppAlb.DNSName
        HostedZoneId: !GetAtt AppAlb.CanonicalHostedZoneID
        EvaluateTargetHealth: false
  AppAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref PlatformCert
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "404"
            ContentType: text/plain
            MessageBody: no app at this path
  AppHttpRedirect:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppAlb
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: "443", StatusCode: HTTP_301 }

  # --- control ALB: internet-facing, in the DEFAULT VPC (the itworker instance was
  # launched there before any infra existed, and an ALB can only target instances in
  # its own VPC). HTTPS on admin.${Domain}, forwarding to the control target group.
  # Auth is the bearer API key checked in the server, not the ALB. ---
  ControlAlbSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: control ALB ingress :443
      VpcId: !Ref DefaultVpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
  ControlAlb:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: openzi-ctrl-alb
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ControlAlbSg]
      Subnets: [!Ref DefaultSubnetA, !Ref DefaultSubnetB]
  ControlTg:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: openzi-ctrl-tg
      Protocol: HTTP
      Port: 8080
      VpcId: !Ref DefaultVpcId
      HealthCheckPath: /
      TargetType: instance
  ControlListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ControlAlb
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref PlatformCert
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ControlTg
  ControlAliasRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub admin.${Domain}
      Type: A
      AliasTarget:
        DNSName: !GetAtt ControlAlb.DNSName
        HostedZoneId: !GetAtt ControlAlb.CanonicalHostedZoneID
        EvaluateTargetHealth: false
  # The control instance SG (default VPC): only the control ALB may reach :8080.
  # itworker setup attaches this SG to the running instance and reuses it in the
  # control launch template, so replacements inherit it.
  ControlInstanceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: control instance :8080 from the control ALB only
      VpcId: !Ref DefaultVpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref ControlAlbSg }

  # --- billing / console user ---
  # Exempted from the sign-in lockout (see the workflow's lock-signin step) so the
  # operator can still pay bills and read (view-only) resource state. ViewOnlyAccess
  # grants no ssm:GetParameter and no kms:Decrypt, so it cannot read the per-version
  # secrets or the API key (SSM SecureString): it sees ciphertext/metadata only.
  ConsoleUser:
    Type: AWS::IAM::User
    Properties:
      UserName: console
      LoginProfile:
        Password: !Ref ConsolePassword
        PasswordResetRequired: false
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/job-function/Billing
        - arn:aws:iam::aws:policy/AWSSupportAccess
        - arn:aws:iam::aws:policy/job-function/ViewOnlyAccess

  # App instances get NO shared role. Each deployed version's launch template uses a
  # per-version instance role (openzi-secret-{n}-{sha}, created at deploy) scoped to
  # read ONLY that version's secret; the container is additionally IMDS-blocked.
  InstanceSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: App instances (:80 + :8081 from app ALB)
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, SourceSecurityGroupId: !Ref AppAlbSg }
        - { IpProtocol: tcp, FromPort: 8081, ToPort: 8081, SourceSecurityGroupId: !Ref AppAlbSg }

  # --- SSM: the monotonic ALB-priority allocator (init + deploy share it; the number
  # doubles as the unique token in per-version resource names). Runtime state also
  # lives under /openzi/: apps/{app}, versions/{app}/{sha}, secrets/{app}/{sha},
  # jobs/{id}, api-key, pinned-commit, repo, console-password, setup/{ok,failed}. ---
  PriorityCounterParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /openzi/priority-counter
      Type: String
      Value: "0"
  # Platform facts the server reads at runtime (was CFN !Sub baked into the old SFNs).
  PlatformConfigParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /openzi/platform-config
      Type: String
      Value: !Sub |
        {"region":"${AWS::Region}","account_id":"${AWS::AccountId}",
         "vpc":"${Vpc}","subnet_a":"${SubnetA}","subnet_b":"${SubnetB}",
         "app_listener_arn":"${AppAlbListener}",
         "instance_sg_id":"${InstanceSg.GroupId}","ib_infra_arn":"${IbInfraConfig.Arn}",
         "ib_dist_arn":"${IbDistConfig.Arn}","domain":"${Domain}",
         "hosted_zone_id":"${HostedZoneId}"}

  # --- Image Builder infra (per-version app bakes) ---
  IbInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: openzi-imagebuilder
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - { Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/EC2InstanceProfileForImageBuilder
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
  IbInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: openzi-imagebuilder
      Roles: [!Ref IbInstanceRole]
  IbInfraConfig:
    Type: AWS::ImageBuilder::InfrastructureConfiguration
    Properties:
      Name: openzi-deploy-infra
      InstanceProfileName: !Ref IbInstanceProfile
      InstanceTypes: [t3.small]
      SubnetId: !Ref SubnetA
      SecurityGroupIds: [!Ref InstanceSg]
      TerminateInstanceOnFailure: true
      # hop limit 1: `docker build` runs the app's Dockerfile on the build instance,
      # and a bridged build container is one hop from IMDS — this stops a hostile
      # Dockerfile from stealing the build role's creds.
      InstanceMetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
  IbDistConfig:
    Type: AWS::ImageBuilder::DistributionConfiguration
    Properties:
      Name: openzi-deploy-dist
      Distributions:
        - Region: !Ref AWS::Region
          AmiDistributionConfiguration: {}

  # --- Daily self-heal: terminate the control instance; the ASG (created by itworker
  # setup, named openzi-control) rebuilds it from its launch template. ---
  RestartSfnRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: openzi-restart-sfn
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: !Sub states.${AWS::Region}.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: restart-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                  - autoscaling:TerminateInstanceInAutoScalingGroup
                Resource: "*"
  RestartSfn:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: openzi-restart
      RoleArn: !GetAtt RestartSfnRole.Arn
      DefinitionString: |
        {
          "Comment": "Daily self-heal: find the control ASG's instance and terminate it (no capacity decrement); the ASG relaunches a fresh instance from its launch template.",
          "StartAt": "DescribeAsg",
          "States": {
            "DescribeAsg": {
              "Type": "Task", "Resource": "arn:aws:states:::aws-sdk:autoscaling:describeAutoScalingGroups",
              "Parameters": {"AutoScalingGroupNames": ["openzi-control"]},
              "ResultPath": "$.asg", "Next": "HasInstance"
            },
            "HasInstance": {
              "Type": "Choice",
              "Choices": [{"Variable": "$.asg.AutoScalingGroups[0].Instances[0].InstanceId", "IsPresent": true, "Next": "Terminate"}],
              "Default": "Done"
            },
            "Terminate": {
              "Type": "Task", "Resource": "arn:aws:states:::aws-sdk:autoscaling:terminateInstanceInAutoScalingGroup",
              "Parameters": {"InstanceId.$": "$.asg.AutoScalingGroups[0].Instances[0].InstanceId", "ShouldDecrementDesiredCapacity": false},
              "ResultPath": null, "Next": "Done"
            },
            "Done": {"Type": "Succeed"}
          }
        }
  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: openzi-restart-scheduler
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start-restart
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: states:StartExecution
                Resource: !Ref RestartSfn
  RestartSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Name: openzi-restart-daily
      ScheduleExpression: cron(0 3 * * ? *)
      ScheduleExpressionTimezone: Asia/Taipei   # 03:00 Taipei (DST-aware); default would be UTC
      FlexibleTimeWindow: { Mode: "OFF" }
      Target:
        Arn: !Ref RestartSfn
        RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  PlatformUrl:
    Value: !Sub https://${Domain}
  AdminUrl:
    Value: !Sub https://admin.${Domain}
  ControlTgArn:
    Description: itworker setup registers the first instance + the control ASG into this target group.
    Value: !Ref ControlTg
  ControlSgId:
    Description: itworker setup attaches this SG to the running instance and reuses it in the control LT.
    Value: !GetAtt ControlInstanceSg.GroupId
